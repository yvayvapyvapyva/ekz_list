<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171b21">
<title>Экзамен ГИБДД · категория «B» — Приказ МВД № 80 (ред. 26.05.2025)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#171b21;--paper:#f2f1ea;--card:#fff;--line:#e3e0d5;
  --ink:#1c2128;--mut:#5f6672;
  --red:#d7362a;--red-d:#b3241a;--orange:#e8702a;--amber:#f2a007;--yellow:#f5c518;
  --green:#23a55a;--blue:#1160b3;--blue-bg:#e9f1fb;--blue-line:#cfe0f2;
  --disp:'Russo One',sans-serif;--body:'Golos Text',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;
  padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:var(--yellow);color:var(--asphalt)}

main{max-width:900px;margin:0 auto;padding:16px 14px 24px}
.tab{display:none}
.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--asphalt);display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.35)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:#8b929e;font-size:10px;font-weight:600;border-radius:10px;position:relative;transition:color .2s}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--yellow)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--yellow);border-radius:0 0 3px 3px}

.h2{font-family:var(--disp);font-size:clamp(18px,4.5vw,24px);margin:8px 0 6px;color:var(--ink)}

.pts-badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  background:#fff;border:4px solid;font-family:var(--disp);font-size:18px;flex-shrink:0}
.pts-badge.p7{border-color:var(--red);color:var(--red)}
.pts-badge.p4{border-color:var(--orange);color:var(--orange)}
.pts-badge.p3{border-color:var(--amber);color:var(--amber)}
.pts-badge.p2{border-color:var(--yellow);color:#9a7000}
.pts-badge.p1{border-color:var(--green);color:var(--green)}
.pts-badge.sm{width:30px;height:30px;border-width:3px;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;transition:transform .15s;border:1px solid}
.chip:active{transform:scale(.95)}
.chip.pdd{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.chip.pdd::before{content:"§";font-weight:700}
.chip.err{background:#fff;border-color:var(--line);color:var(--ink)}

.err-item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.err-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.err-head .num{font-family:var(--disp);font-size:13px;color:var(--mut);min-width:44px}
.err-head .title{flex:1;font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.err-head .chev{width:20px;height:20px;color:var(--mut);transition:transform .25s;flex-shrink:0}
.err-item.open .chev{transform:rotate(180deg)}
.err-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.err-item.open .err-body{grid-template-rows:1fr}
.err-body-inner{overflow:hidden;min-height:0}
.err-content{padding:0 16px 16px;border-top:1px dashed var(--line);margin:0 0}
.err-content .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.err-content .label:first-child{margin-top:14px}
.sit-list{list-style:none}
.sit-list li{position:relative;padding:8px 10px 8px 30px;background:#fff7ed;border-left:3px solid var(--orange);border-radius:0 8px 8px 0;font-size:13.5px;color:#5c3a1e;margin-bottom:6px}
.sit-list li::before{content:"⚠";position:absolute;left:9px;top:8px;font-size:13px}
.err-desc{font-size:13.5px;color:#3d4450;background:#f6f5ef;padding:10px 12px;border-radius:8px}

.sect-banner{border-radius:12px;padding:12px 14px;margin:18px 0 12px;color:#fff;font-size:13px;font-weight:600}
.sect-banner.s2{background:var(--red-d)}
.sect-banner.s3{background:var(--orange)}
.sect-banner.s4{background:var(--amber);color:#3d2800}
.sect-banner.s5{background:var(--yellow);color:#3d2800}
.sect-banner.s6{background:var(--green)}
.sect-banner b{font-family:var(--disp);font-size:14px;display:block;margin-bottom:2px}

/* Модальное окно */
.modal-back{position:fixed;inset:0;background:rgba(20,23,28,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-back.show{display:flex}
.modal{background:#fff;width:100%;max-width:640px;max-height:82vh;border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;animation:sheetUp .3s ease}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 14px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-head .title{font-family:var(--disp);font-size:17px;color:var(--ink);line-height:1.3}
.modal-close{width:36px;height:36px;border-radius:50%;background:#f6f5ef;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.modal-body{font-size:14.5px;color:#3d4450;line-height:1.55}
.modal-body .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.modal-body .lbl:first-child{margin-top:0}
@media(min-width:640px){
  .modal-back{align-items:center;padding:20px}
  .modal{border-radius:18px}
}

.empty-msg{text-align:center;color:var(--mut);padding:30px 16px;font-size:14px}
</style>
</head>
<body>

<main>
  <!-- ВКЛАДКА: ЗАДАНИЯ -->
  <section class="tab active" id="tab-tasks">
    <h2 class="h2">Задания экзамена</h2>
    <div id="tasks-list"></div>
  </section>

  <!-- ВКЛАДКА: ОШИБКИ -->
  <section class="tab" id="tab-errors">
    <h2 class="h2">Ошибки и нарушения</h2>
    <div id="errors-list"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="tab-tasks" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h10M9 12h10M9 19h10"/><path d="M4 6l1.5 1.5L8 5M4 13l1.5 1.5L8 13M4 20l1.5 1.5L8 20" stroke-linejoin="round"/></svg>
    Задания
  </button>
  <button data-tab="tab-errors">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L2 20h20L12 3z" stroke-linejoin="round"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
    Ошибки
  </button>
</nav>

<div class="modal-back" id="modal-back">
  <div class="modal">
    <div class="grab"></div>
    <div class="modal-head">
      <div class="title" id="modal-title"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
/* ===== ДАННЫЕ: ПУНКТЫ ПДД ===== */
const PDD = {
"1.2":{t:`«Уступить дорогу (не создавать помех)» — требование, означающее, что участник дорожного движения не должен начинать, возобновлять или продолжать движение, осуществлять какой-либо маневр, если это может вынудить других участников движения, имеющих по отношению к нему преимущество, изменить направление движения или скорость.`},
"2.1.2":{t:`При движении на транспортном средстве, оборудованном ремнями безопасности, быть пристегнутым и не перевозить пассажиров, не пристегнутых ремнями. При управлении мотоциклом быть в застегнутом мотошлеме и не перевозить пассажиров без застегнутого мотошлема.`},
"2.7":{t:`Водителю запрещается: управлять транспортным средством в состоянии опьянения (алкогольного, наркотического или иного), под воздействием лекарственных препаратов, ухудшающих реакцию и внимание, в болезненном или утомленном состоянии, ставящем под угрозу безопасность движения; передавать управление транспортным средством лицам, находящимся в состоянии опьянения, под воздействием лекарственных препаратов, в болезненном или утомленном состоянии, а также лицам, не имеющим при себе водительского удостоверения на право управления транспортным средством соответствующей категории или подкатегории, кроме случаев обучения вождению в соответствии с разделом 21 Правил; пересекать организованные (в том числе и пешие) колонны и занимать место в них; употреблять алкогольные напитки, наркотические, психотропные или иные одурманивающие вещества после дорожно-транспортного происшествия, к которому он причастен, либо после того, как транспортное средство было остановлено по требованию сотрудника полиции, до проведения освидетельствования с целью установления состояния опьянения или до принятия решения об освобождении от проведения такого освидетельствования; управлять транспортным средством с нарушением режима труда и отдыха, установленного уполномоченным федеральным органом исполнительной власти, а при осуществлении международных автомобильных перевозок — международными договорами Российской Федерации; пользоваться во время движения телефоном, не оборудованным техническим устройством, позволяющим вести переговоры без использования рук; опасное вождение, выражающееся в неоднократном совершении одного или совершении нескольких следующих друг за другом действий, заключающихся в невыполнении при перестроении требования уступить дорогу транспортному средству, пользующемуся преимущественным правом движения, перестроении при интенсивном движении, когда все полосы движения заняты, кроме случаев поворота налево или направо, разворота, остановки или объезда препятствия, несоблюдении безопасной дистанции до движущегося впереди транспортного средства, несоблюдении бокового интервала, резком торможении, если такое торможение не требуется для предотвращения дорожно-транспортного происшествия, препятствовании обгону, если указанные действия повлекли создание водителем в процессе дорожного движения ситуации, при которой его движение и (или) движение иных участников дорожного движения в том же направлении и с той же скоростью создает угрозу гибели или ранения людей, повреждения транспортных средств, сооружений, грузов или причинения иного материального ущерба.`},
"3.1":{t:`Водители транспортных средств с включенным проблесковым маячком синего цвета, выполняя неотложное служебное задание, могут отступать от требований разделов 6 (кроме сигналов регулировщика) и 8–18 настоящих Правил, приложений 1 и 2 к настоящим Правилам при условии обеспечения безопасности движения. Для получения преимущества перед другими участниками движения водители транспортных средств, указанных в абзацах первом и третьем настоящего пункта, должны включить проблесковый маячок синего цвета или проблесковые маячки синего и красного цветов и специальный звуковой сигнал. Воспользоваться приоритетом они могут только убедившись, что им уступают дорогу.`},
"3.2":{t:`При приближении транспортного средства с включенными проблесковым маячком синего цвета и специальным звуковым сигналом водители обязаны уступить дорогу или освободить полосу (ряд) проезжей части путем перестроения или выполнить иной маневр, предусмотренный Правилами, в случае приближения по той же полосе (в том же ряду) указанного транспортного средства для обеспечения его беспрепятственного проезда. Запрещается выполнять обгон транспортного средства, имеющего нанесенные на наружные поверхности специальные цветографические схемы, с включенными проблесковым маячком синего цвета и специальным звуковым сигналом. Запрещается выполнять обгон и опережение транспортного средства с включенными проблесковыми маячками синего и красного цветов и специальным звуковым сигналом, а также сопровождаемого им транспортного средства (сопровождаемых транспортных средств), двигаться по соседним полосам (в соседних рядах) с их скоростью движения, создавая помехи, препятствуя их организованному движению.`},
"6.2":{t:`Круглые сигналы светофора имеют следующие значения: ЗЕЛЁНЫЙ СИГНАЛ разрешает движение; ЗЕЛЁНЫЙ МИГАЮЩИЙ СИГНАЛ разрешает движение и информирует, что время его действия истекает и вскоре будет включен запрещающий сигнал (для информирования водителей о времени в секундах, остающемся до конца горения зеленого сигнала, могут применяться цифровые табло); ЖЁЛТЫЙ СИГНАЛ запрещает движение, кроме случаев, предусмотренных пунктом 6.14 Правил, и предупреждает о предстоящей смене сигналов; ЖЁЛТЫЙ МИГАЮЩИЙ СИГНАЛ разрешает движение и информирует о наличии нерегулируемого перекрестка или пешеходного перехода, предупреждает об опасности; КРАСНЫЙ СИГНАЛ, в том числе мигающий, запрещает движение. Сочетание красного и желтого сигналов запрещает движение и информирует о предстоящем включении зеленого сигнала.`},
"6.3":{t:`Сигналы светофора, выполненные в виде стрелок красного, желтого и зеленого цветов, имеют то же значение, что и круглые сигналы соответствующего цвета, но их действие распространяется только на направление (направления), указываемое стрелками. При этом стрелка, разрешающая поворот налево, разрешает и разворот, если это не запрещено соответствующим дорожным знаком. Такое же значение имеет зеленая стрелка в дополнительной секции. Выключенный сигнал дополнительной секции или включенный световой сигнал красного цвета ее контура означает запрещение движения в направлении, регулируемом этой секцией.`},
"6.4":{t:`Если на основной зеленый сигнал светофора нанесена черная контурная стрелка (стрелки), то она информирует водителей о наличии дополнительной секции светофора и указывает иные разрешенные направления движения, чем сигнал дополнительной секции.`},
"6.7":{t:`Для регулирования движения транспортных средств по полосам проезжей части, в частности по тем, направление движения по которым может изменяться на противоположное, применяются реверсивные светофоры с красным Х-образным сигналом и зеленым сигналом в виде стрелы, направленной вниз. Эти сигналы соответственно запрещают или разрешают движение по полосе, над которой они расположены. Основные сигналы реверсивного светофора могут быть дополнены желтым сигналом в виде стрелы, наклоненной по диагонали вниз направо или налево, включение которой информирует о предстоящей смене сигнала и необходимости перестроиться на полосу, на которую указывает стрела.`},
"6.9":{t:`Круглый бело-лунный мигающий сигнал, расположенный на железнодорожном переезде, разрешает движение транспортных средств через переезд. При выключенных мигающих бело-лунном и красном сигналах движение разрешается при отсутствии в пределах видимости приближающегося к переезду поезда (локомотива, дрезины).`},
"6.10":{t:`Сигналы регулировщика имеют следующие значения: РУКИ ВЫТЯНУТЫ В СТОРОНЫ ИЛИ ОПУЩЕНЫ: со стороны левого и правого бока разрешено движение трамваю прямо, безрельсовым транспортным средствам прямо и направо, пешеходам разрешено переходить проезжую часть; со стороны груди и спины движение всех транспортных средств и пешеходов запрещено. ПРАВАЯ РУКА ВЫТЯНУТА ВПЕРЕД: со стороны левого бока разрешено движение трамваю налево, безрельсовым транспортным средствам во всех направлениях; со стороны груди всем транспортным средствам разрешено движение только направо; со стороны правого бока и спины движение всех транспортных средств запрещено; пешеходам разрешено переходить проезжую часть за спиной регулировщика. РУКА ПОДНЯТА ВВЕРХ: движение всех транспортных средств и пешеходов запрещено во всех направлениях, кроме случаев, предусмотренных пунктом 6.14 Правил. Регулировщик может подавать жестами рук и другие сигналы, понятные водителям и пешеходам.`},
"6.13":{t:`При запрещающем сигнале светофора (кроме реверсивного) или регулировщика водители должны остановиться перед стоп-линией (знаком 6.16), а при ее отсутствии: на перекрестке — перед пересекаемой проезжей частью (с учетом пункта 13.7 Правил), не создавая помех пешеходам; перед железнодорожным переездом — в соответствии с пунктом 15.4 Правил; в других местах — перед светофором или регулировщиком, не создавая помех транспортным средствам и пешеходам, движение которых разрешено.`},
"6.14":{t:`Водителям, которые при включении желтого сигнала или поднятии регулировщиком руки вверх не могут остановиться, не прибегая к экстренному торможению в местах, определяемых пунктом 6.13 Правил, разрешается дальнейшее движение. Пешеходы и лица, использующие для передвижения средства индивидуальной мобильности, которые при подаче сигнала находились на проезжей части, должны освободить ее, а если это невозможно — остановиться на линии, разделяющей транспортные потоки противоположных направлений.`},
"7.1":{t:`Аварийная сигнализация должна быть включена: при дорожно-транспортном происшествии; при вынужденной остановке в местах, где остановка запрещена; при ослеплении водителя светом фар; при буксировке (на буксируемом механическом транспортном средстве); при посадке детей в транспортное средство, имеющее опознавательные знаки «Перевозка детей», и высадке из него. Водитель должен включать аварийную сигнализацию и в других случаях для предупреждения участников движения об опасности, которую может создать транспортное средство.`},
"7.2":{t:`При остановке транспортного средства и включении аварийной сигнализации, а также при ее неисправности или отсутствии знак аварийной остановки должен быть незамедлительно выставлен: при дорожно-транспортном происшествии; при вынужденной остановке в местах, где она запрещена, и там, где с учетом условий видимости транспортное средство не может быть своевременно замечено другими водителями. Этот знак устанавливается на расстоянии, обеспечивающем в конкретной обстановке своевременное предупреждение других водителей об опасности. Однако это расстояние должно быть не менее 15 м от транспортного средства в населенных пунктах и 30 м — вне населенных пунктов.`},
"8.1":{t:`Перед началом движения, перестроением, поворотом (разворотом) и остановкой водитель обязан подавать сигналы световыми указателями поворота соответствующего направления, а если они отсутствуют или неисправны — рукой. При выполнении маневра не должны создаваться опасность для движения, а также помехи другим участникам дорожного движения. Сигналу левого поворота (разворота) соответствует вытянутая в сторону левая рука либо правая, вытянутая в сторону и согнутая в локте под прямым углом вверх. Сигналу правого поворота соответствует вытянутая в сторону правая рука либо левая, вытянутая в сторону и согнутая в локте под прямым углом вверх. Сигнал торможения подается поднятой вверх левой или правой рукой.`},
"8.2":{t:`Подача сигнала указателями поворота или рукой должна производиться заблаговременно до начала выполнения маневра и прекращаться немедленно после его завершения (подача сигнала рукой может быть закончена непосредственно перед выполнением маневра). При этом сигнал не должен вводить в заблуждение других участников движения. Подача сигнала не дает водителю преимущества и не освобождает его от принятия мер предосторожности.`},
"8.3":{t:`При выезде на дорогу с прилегающей территории водитель должен уступить дорогу транспортным средствам, лицам, использующим для передвижения средства индивидуальной мобильности, и пешеходам, движущимся по ней, а при съезде с дороги — пешеходам, велосипедистам и лицам, использующим для передвижения средства индивидуальной мобильности, путь движения которых он пересекает.`},
"8.4":{t:`При перестроении водитель должен уступить дорогу транспортным средствам, движущимся попутно без изменения направления движения. При одновременном перестроении транспортных средств, движущихся попутно, водитель должен уступить дорогу транспортному средству, находящемуся справа.`},
"8.5":{t:`Перед поворотом направо, налево или разворотом водитель обязан заблаговременно занять соответствующее крайнее положение на проезжей части, предназначенной для движения в данном направлении, кроме случаев, когда совершается поворот при въезде на перекресток, где организовано круговое движение. При наличии слева трамвайных путей попутного направления, расположенных на одном уровне с проезжей частью, поворот налево и разворот должны выполняться с них, если знаками 5.15.1 или 5.15.2 либо разметкой 1.18 не предписан иной порядок движения. При этом не должно создаваться помех трамваю.`},
"8.6":{t:`Поворот должен осуществляться таким образом, чтобы при выезде с пересечения проезжих частей транспортное средство не оказалось на стороне встречного движения. При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части.`},
"8.7":{t:`Если транспортное средство из-за своих габаритов или по другим причинам не может выполнить поворот с соблюдением требований пункта 8.5 Правил, допускается отступать от них при условии обеспечения безопасности движения и если это не создаст помех другим транспортным средствам.`},
"8.8":{t:`При повороте налево или развороте вне перекрестка водитель безрельсового транспортного средства обязан уступить дорогу встречным транспортным средствам и трамваю попутного направления. Если при развороте вне перекрестка ширина проезжей части недостаточна для выполнения маневра из крайнего левого положения, его допускается производить от правого края проезжей части (с правой обочины). При этом водитель должен уступить дорогу попутным и встречным транспортным средствам.`},
"8.9":{t:`В случаях, когда траектории движения транспортных средств пересекаются, а очередность проезда не оговорена Правилами, дорогу должен уступить водитель, к которому транспортное средство приближается справа.`},
"8.11":{t:`Разворот запрещается: на пешеходных переходах; в тоннелях; на мостах, путепроводах, эстакадах и под ними; на железнодорожных переездах; в местах с видимостью дороги хотя бы в одном направлении менее 100 м; в местах остановок маршрутных транспортных средств.`},
"8.12":{t:`Движение транспортного средства задним ходом разрешается при условии, что этот маневр будет безопасен и не создаст помех другим участникам движения. При необходимости водитель должен прибегнуть к помощи других лиц. Движение задним ходом запрещается на перекрестках и в местах, где запрещен разворот согласно пункту 8.11 Правил.`},
"9.1(1)":{t:`На любых дорогах с двусторонним движением запрещается движение по полосе, предназначенной для встречного движения, если она отделена трамвайными путями, разделительной полосой, разметкой 1.1, 1.3 или разметкой 1.11, прерывистая линия которой расположена слева.`},
"9.2":{t:`На дорогах с двусторонним движением, имеющих четыре или более полосы, запрещается выезжать для обгона или объезда на полосу, предназначенную для встречного движения. На таких дорогах повороты налево или развороты могут выполняться на перекрестках и в других местах, где это не запрещено Правилами, знаками и (или) разметкой.`},
"9.3":{t:`На дорогах с двусторонним движением, имеющих три полосы, обозначенные разметкой (за исключением разметки 1.9), из которых средняя используется для движения в обоих направлениях, разрешается выезжать на эту полосу только для обгона, объезда, поворота налево или разворота. Выезжать на крайнюю левую полосу, предназначенную для встречного движения, запрещается.`},
"9.4":{t:`Вне населенных пунктов, а также в населенных пунктах на дорогах, обозначенных знаком 5.1 или 5.3 или где разрешено движение со скоростью более 80 км/ч, водители транспортных средств должны вести их по возможности ближе к правому краю проезжей части. Запрещается занимать левые полосы движения при свободных правых. В населенных пунктах с учетом требований настоящего пункта и пунктов 9.5, 16.1 и 24.2 Правил водители транспортных средств могут использовать наиболее удобную для них полосу движения. При интенсивном движении, когда все полосы движения заняты, менять полосу разрешается только для поворота налево или направо, разворота, остановки или объезда препятствия. Однако на любых дорогах, имеющих для движения в данном направлении три полосы и более, занимать крайнюю левую полосу разрешается только при интенсивном движении, когда заняты другие полосы, а также для поворота налево или разворота, а грузовым автомобилям с разрешенной максимальной массой более 2,5 т — только для поворота налево или разворота. Выезд на левую полосу дорог с односторонним движением для остановки и стоянки осуществляется в соответствии с пунктом 12.1 Правил.`},
"9.6":{t:`Разрешается движение по трамвайным путям попутного направления, расположенным слева на одном уровне с проезжей частью, когда заняты все полосы данного направления, а также при объезде, повороте налево или развороте с учетом пункта 8.5 Правил. При этом не должно создаваться помех трамваю. Выезжать на трамвайные пути встречного направления запрещается. Если перед перекрестком установлены дорожные знаки 5.15.1 или 5.15.2, движение по трамвайным путям через перекресток запрещается.`},
"9.7":{t:`Если проезжая часть разделена на полосы линиями разметки, движение транспортных средств должно осуществляться строго по обозначенным полосам. Наезжать на прерывистые линии разметки разрешается лишь при перестроении.`},
"9.8":{t:`При повороте на дорогу с реверсивным движением водитель должен вести транспортное средство таким образом, чтобы при выезде с пересечения проезжих частей транспортное средство заняло крайнюю правую полосу. Перестроение разрешается только после того, как водитель убедится, что движение в данном направлении разрешается и по другим полосам.`},
"9.10":{t:`Водитель должен соблюдать такую дистанцию до движущегося впереди транспортного средства, которая позволила бы избежать столкновения, а также необходимый боковой интервал, обеспечивающий безопасность движения.`},
"9.11":{t:`Вне населенных пунктов на дорогах с двусторонним движением, имеющих две полосы, водитель транспортного средства, для которого установлено ограничение скорости, а также водитель транспортного средства (состава транспортных средств) длиной более 7 м должен поддерживать между своим и движущимся впереди транспортным средством такую дистанцию, чтобы обгоняющие его транспортные средства могли без помех перестроиться на ранее занимаемую ими полосу. Это требование не действует при движении по участкам дорог, на которых запрещается обгон, а также при интенсивном движении и движении в организованной транспортной колонне.`},
"9.12":{t:`На дорогах с двусторонним движением при отсутствии разделительной полосы островки направляющие, островки безопасности, тумбы и элементы дорожных сооружений (опоры мостов, путепроводов и тому подобное), находящиеся на середине проезжей части, водитель должен объезжать справа, если знаки и разметка не предписывают иное.`},
"10.1":{t:`Водитель должен вести транспортное средство со скоростью, не превышающей установленного ограничения, учитывая при этом интенсивность движения, особенности и состояние транспортного средства и груза, дорожные и метеорологические условия, в частности видимость в направлении движения. Скорость должна обеспечивать водителю возможность постоянного контроля за движением транспортного средства для выполнения требований Правил. При возникновении опасности для движения, которую водитель в состоянии обнаружить, он должен принять возможные меры к снижению скорости вплоть до остановки транспортного средства.`},
"10.2":{t:`В населенных пунктах разрешается движение транспортных средств со скоростью не более 60 км/ч, а в жилых зонах, велосипедных зонах и на дворовых территориях не более 20 км/ч. Примечание. По решению органов исполнительной власти субъектов Российской Федерации может разрешаться повышение скорости (с установкой соответствующих знаков) на участках дорог или полосах движения для отдельных видов транспортных средств, если дорожные условия обеспечивают безопасное движение с большей скоростью. В этом случае величина разрешенной скорости не должна превышать значения, установленные для соответствующих видов транспортных средств на автомагистралях.`},
"10.3":{t:`Вне населенных пунктов разрешается движение: мотоциклам, легковым автомобилям и грузовым автомобилям с разрешенной максимальной массой не более 3,5 т на автомагистралях — со скоростью не более 110 км/ч, на остальных дорогах — не более 90 км/ч; автобусам, в которых места для сидения пассажиров оборудованы ремнями безопасности, предназначенным для перевозки исключительно сидящих пассажиров, — не более 90 км/ч, другим автобусам — не более 70 км/ч; легковым автомобилям при буксировке прицепа, грузовым автомобилям с разрешенной максимальной массой более 3,5 т на автомагистралях — не более 90 км/ч, на остальных дорогах — не более 70 км/ч; грузовым автомобилям, перевозящим людей в кузове, — не более 60 км/ч; автобусам, осуществляющим организованные перевозки групп детей, — не более 60 км/ч.`},
"10.4":{t:`Транспортным средствам, буксирующим механические транспортные средства, разрешается движение со скоростью не более 50 км/ч. Тяжеловесным транспортным средствам, крупногабаритным транспортным средствам и транспортным средствам, осуществляющим перевозки опасных грузов, разрешается движение со скоростью, не превышающей скорости, указанной в специальном разрешении, при наличии которого в соответствии с законодательством об автомобильных дорогах и о дорожной деятельности допускается движение по автомобильным дорогам таких транспортных средств.`},
"10.5":{t:`Водителю запрещается: превышать максимальную скорость, определенную технической характеристикой транспортного средства; превышать скорость, указанную на опознавательном знаке «Ограничение скорости», установленном на транспортном средстве; создавать помехи другим транспортным средствам, двигаясь без необходимости со слишком малой скоростью; резко тормозить, если это не требуется для предотвращения дорожно-транспортного происшествия.`},
"11.1":{t:`Прежде чем начать обгон, водитель обязан убедиться в том, что полоса движения, на которую он собирается выехать, свободна на достаточном для обгона расстоянии и в процессе обгона он не создаст опасности для движения и помех другим участникам дорожного движения.`},
"11.2":{t:`Водителю запрещается выполнять обгон в случаях, если: транспортное средство, движущееся впереди, производит обгон или объезд препятствия; транспортное средство, движущееся впереди по той же полосе, подало сигнал поворота налево; следующее за ним транспортное средство начало обгон; по завершении обгона он не сможет, не создавая опасности для движения и помех обгоняемому транспортному средству, вернуться на ранее занимаемую полосу.`},
"11.3":{t:`Водителю обгоняемого транспортного средства запрещается препятствовать обгону посредством повышения скорости движения или иными действиями.`},
"11.4":{t:`Обгон запрещен: на регулируемых перекрестках, а также на нерегулируемых перекрестках при движении по дороге, не являющейся главной; на пешеходных переходах; на железнодорожных переездах и ближе чем за 100 метров перед ними; на мостах, путепроводах, эстакадах и под ними, а также в тоннелях; в конце подъема, на опасных поворотах и на других участках с ограниченной видимостью.`},
"11.5":{t:`Опережение транспортных средств при проезде пешеходных переходов осуществляется с учетом требований пункта 14.2 Правил.`},
"11.7":{t:`В случае если встречный разъезд затруднен, водитель, на стороне которого имеется препятствие, должен уступить дорогу. Уступить дорогу при наличии препятствия на уклонах, обозначенных знаками 1.13 и 1.14, должен водитель транспортного средства, движущегося на спуск.`},
"12.1":{t:`Остановка и стоянка транспортных средств разрешаются на правой стороне дороги на обочине, а при ее отсутствии — на проезжей части у ее края и в случаях, установленных пунктом 12.2 Правил, — на тротуаре. На левой стороне дороги остановка и стоянка разрешаются в населенных пунктах на дорогах с одной полосой движения для каждого направления без трамвайных путей посередине и на дорогах с односторонним движением (грузовым автомобилям с разрешенной максимальной массой более 3,5 т на левой стороне дорог с односторонним движением разрешается лишь остановка для загрузки или разгрузки).`},
"12.2":{t:`Ставить транспортное средство разрешается в один ряд параллельно краю проезжей части. Двухколесные транспортные средства без бокового прицепа допускается ставить в два ряда. Способ постановки транспортного средства на стоянке (парковке) определяется знаком 6.4 и линиями дорожной разметки, знаком 6.4 с одной из табличек 8.6.1–8.6.9 и линиями дорожной разметки или без таковых. Сочетание знака 6.4 с одной из табличек 8.6.4–8.6.9, а также линиями дорожной разметки допускает постановку транспортного средства под углом к краю проезжей части в случае, если конфигурация (местное уширение) проезжей части допускает такое расположение. Стоянка на краю тротуара, граничащего с проезжей частью, разрешается только легковым автомобилям, мотоциклам и мопедам в местах, обозначенных знаком 6.4 с одной из табличек 8.6.2, 8.6.3 и 8.6.6–8.6.9.`},
"12.3":{t:`Стоянка с целью длительного отдыха, ночлега и тому подобное вне населенного пункта разрешается только на предусмотренных для этого площадках или за пределами дороги.`},
"12.4":{t:`Остановка запрещается: на трамвайных путях, а также в непосредственной близости от них, если это создаст помехи движению трамваев; на железнодорожных переездах, в тоннелях, а также на эстакадах, мостах, путепроводах (если для движения в данном направлении имеется менее трех полос) и под ними; в местах, где расстояние между сплошной линией разметки (кроме обозначающей край проезжей части), разделительной полосой или противоположным краем проезжей части и остановившимся транспортным средством менее 3 м; на пешеходных переходах и ближе 5 м перед ними; на проезжей части вблизи опасных поворотов и выпуклых переломов продольного профиля дороги при видимости дороги менее 100 м хотя бы в одном направлении; на пересечении проезжих частей и ближе 5 м от края пересекаемой проезжей части, за исключением стороны напротив бокового проезда трехсторонних пересечений (перекрестков), имеющих сплошную линию разметки или разделительную полосу; ближе 15 метров от мест остановки маршрутных транспортных средств или стоянки легковых такси, обозначенных разметками 1.17.1 и 1.17.2, а при ее отсутствии — от указателя места остановки маршрутных транспортных средств или стоянки легковых такси (кроме остановки для посадки и высадки пассажиров, если это не создаст помех движению маршрутных транспортных средств или транспортных средств, используемых в качестве легкового такси); в местах, где транспортное средство закроет от других водителей сигналы светофора, дорожные знаки, или сделает невозможным движение (въезд или выезд) других транспортных средств (в том числе на велосипедных или велопешеходных дорожках, а также ближе 5 м от пересечения велосипедной или велопешеходной дорожки с проезжей частью), или создаст помехи для движения пешеходов (в том числе в местах сопряжения проезжей части и тротуара в одном уровне, предназначенных для движения маломобильных граждан); на полосе для велосипедистов; на островках направляющих и островках безопасности.`},
"12.5":{t:`Стоянка запрещается: в местах, где запрещена остановка; вне населенных пунктов на проезжей части дорог, обозначенных знаком 2.1; ближе 50 м от железнодорожных переездов.`},
"12.6":{t:`При вынужденной остановке в местах, где остановка запрещена, водитель должен принять все возможные меры для отвода транспортного средства из этих мест.`},
"12.7":{t:`Запрещается открывать двери транспортного средства, если это создаст помехи другим участникам дорожного движения.`},
"12.8":{t:`Водитель может покидать свое место или оставлять транспортное средство, если им приняты необходимые меры, исключающие самопроизвольное движение транспортного средства или использование его в отсутствие водителя. Запрещается оставлять в транспортном средстве на время его стоянки ребенка в возрасте младше 7 лет в отсутствие совершеннолетнего лица.`},
"13.1":{t:`При повороте направо или налево водитель обязан уступить дорогу пешеходам, лицам, использующим для передвижения средства индивидуальной мобильности, и велосипедистам, пересекающим проезжую часть дороги, на которую он поворачивает.`},
"13.2":{t:`Запрещается выезжать на перекресток, пересечение проезжих частей или участка перекрестка, обозначенного разметкой 1.26, если впереди по пути следования образовался затор, который вынудит водителя остановиться, создав препятствие для движения транспортных средств в поперечном направлении, за исключением поворота направо или налево в случаях, установленных настоящими Правилами.`},
"13.4":{t:`При повороте налево или развороте по зеленому сигналу светофора водитель безрельсового транспортного средства обязан уступить дорогу транспортным средствам, движущимся со встречного направления прямо или направо. Таким же правилом должны руководствоваться между собой водители трамваев.`},
"13.6":{t:`Если сигналы светофора или регулировщика разрешают движение одновременно трамваю и безрельсовым транспортным средствам, то трамвай имеет преимущество независимо от направления его движения. Однако при движении в направлении стрелки, включенной в дополнительной секции одновременно с красным или желтым сигналом светофора, трамвай должен уступить дорогу транспортным средствам, движущимся с других направлений.`},
"13.8":{t:`При включении разрешающего сигнала светофора водитель обязан уступить дорогу транспортным средствам, завершающим движение через перекресток, и пешеходам, не закончившим переход проезжей части данного направления.`},
"13.9":{t:`На перекрестке неравнозначных дорог водитель транспортного средства, движущегося по второстепенной дороге, должен уступить дорогу транспортным средствам, приближающимся по главной, независимо от направления их дальнейшего движения. На таких перекрестках трамвай имеет преимущество перед безрельсовыми транспортными средствами, движущимися в попутном или встречном направлении по равнозначной дороге, независимо от направления его движения.`},
"13.11":{t:`На перекрестке равнозначных дорог, за исключением случая, предусмотренного пунктом 13.11(1), водитель безрельсового транспортного средства обязан уступить дорогу транспортным средствам, приближающимся справа. Этим же правилом должны руководствоваться между собой водители трамваев. На таких перекрестках трамвай имеет преимущество перед безрельсовыми транспортными средствами независимо от направления его движения.`},
"13.11(1)":{t:`При въезде по дороге, не являющейся главной, на перекресток, на котором организовано круговое движение и который обозначен знаком 4.3, водитель транспортного средства обязан уступить дорогу транспортным средствам, движущимся по такому перекрестку.`},
"13.12":{t:`При повороте налево или развороте водитель безрельсового транспортного средства обязан уступить дорогу транспортным средствам, движущимся по равнозначной дороге со встречного направления прямо или направо. Этим же правилом должны руководствоваться между собой водители трамваев.`},
"13.13":{t:`Если водитель не может определить наличие покрытия на дороге (темное время суток, грязь, снег и тому подобное), а знаков приоритета нет, он должен считать, что находится на второстепенной дороге.`},
"13.7":{t:`Водитель, въехавший на перекресток при разрешающем сигнале светофора, должен выехать в намеченном направлении независимо от сигналов светофора на выходе с перекрестка. Однако, если на перекрестке перед светофорами, расположенными на пути следования водителя, имеются стоп-линии (знаки 6.16), водитель обязан руководствоваться сигналами каждого светофора.`},
"14.1":{t:`Водитель транспортного средства, приближающегося к нерегулируемому пешеходному переходу, обязан уступить дорогу пешеходам, переходящим дорогу или вступившим на проезжую часть (трамвайные пути) для осуществления перехода.`},
"14.2":{t:`Если перед нерегулируемым пешеходным переходом остановилось или снизило скорость транспортное средство, то водители других транспортных средств, движущихся в том же направлении, также обязаны остановиться или снизить скорость. Продолжать движение разрешено с учетом требований пункта 14.1 Правил.`},
"14.3":{t:`На регулируемых пешеходных переходах при включении разрешающего сигнала светофора водитель должен дать возможность пешеходам и лицам, использующим для передвижения средства индивидуальной мобильности, закончить пересечение проезжей части (трамвайных путей) соответствующего направления.`},
"14.4":{t:`Запрещается въезжать на пешеходный переход, если за ним образовался затор, который вынудит водителя остановиться на пешеходном переходе.`},
"14.5":{t:`Во всех случаях, в том числе и вне пешеходных переходов, водитель обязан пропустить слепых пешеходов, подающих сигнал белой тростью.`},
"14.6":{t:`Водитель должен уступить дорогу пешеходам, идущим к стоящему в месте остановки маршрутному транспортному средству или от него (со стороны дверей), если посадка и высадка производятся с проезжей части или с посадочной площадки, расположенной на ней. В случае если на таком стоящем маршрутном транспортном средстве включено световое табло «Внимание, пассажир!», водитель, приближающийся сзади, должен остановиться перед разметкой 1.17.2, а при ее отсутствии — перед маршрутным транспортным средством, не создавая помех пешеходам, осуществляющим посадку и высадку с проезжей части или с посадочной площадки, расположенной на ней. Начинать движение разрешается только при отсутствии пешеходов на проезжей части и после выключения светового табло «Внимание, пассажир!».`},
"14.7":{t:`Приближаясь к остановившемуся транспортному средству с включенной аварийной сигнализацией, имеющему опознавательные знаки «Перевозка детей», водитель должен снизить скорость, при необходимости остановиться и пропустить детей.`},
"15.1":{t:`Водители транспортных средств могут пересекать железнодорожные пути только по железнодорожным переездам, уступая дорогу поезду (локомотиву, дрезине).`},
"15.2":{t:`При подъезде к железнодорожному переезду водитель обязан руководствоваться требованиями дорожных знаков, светофоров, разметки, положением шлагбаума и указаниями дежурного по переезду и убедиться в отсутствии приближающегося поезда (локомотива, дрезины).`},
"15.3":{t:`Запрещается выезжать на переезд: при закрытом или начинающем закрываться шлагбауме (независимо от сигнала светофора); при запрещающем сигнале светофора (независимо от положения и наличия шлагбаума); при запрещающем сигнале дежурного по переезду (дежурный обращен к водителю грудью или спиной с поднятым над головой жезлом, красным фонарем или флажком, либо с вытянутыми в сторону руками); если за переездом образовался затор, который вынудит водителя остановиться на переезде; если к переезду в пределах видимости приближается поезд (локомотив, дрезина). Кроме того, запрещается: объезжать с выездом на полосу встречного движения стоящие перед переездом транспортные средства; самовольно открывать шлагбаум; провозить через переезд в нетранспортном положении сельскохозяйственные, дорожные, строительные и другие машины и механизмы; без разрешения начальника дистанции пути железной дороги движение тихоходных машин, скорость которых менее 8 км/ч, а также тракторных саней-волокуш.`},
"15.4":{t:`В случаях когда движение через переезд запрещено, водитель должен остановиться у стоп-линии и (или) знака 6.16, знака 2.5, если их нет — не ближе 5 м от светофора или шлагбаума, а при отсутствии светофора или шлагбаума — не ближе 10 м до ближайшего рельса.`},
"17.1":{t:`В жилой зоне, то есть на территории, въезды на которую и выезды с которой обозначены знаками 5.21 и 5.22, движение пешеходов разрешается как по тротуарам, так и по проезжей части. В жилой зоне пешеходы имеют преимущество, при этом они не должны создавать на проезжей части необоснованные помехи для движения транспортных средств и лиц, использующих для передвижения средства индивидуальной мобильности.`},
"18.1":{t:`Вне перекрестков, где трамвайные пути пересекают проезжую часть, трамвай имеет преимущество перед безрельсовыми транспортными средствами, кроме случаев выезда из депо.`},
"18.2":{t:`На дорогах с полосой для маршрутных транспортных средств, обозначенных знаками 5.11.1, 5.13.1, 5.13.2 и 5.14, запрещаются движение и остановка других транспортных средств на этой полосе, за исключением: школьных автобусов; транспортных средств, используемых в качестве легкового такси; транспортных средств, которые используются для перевозки пассажиров, имеют, за исключением места водителя, более 8 мест для сидения, технически допустимая максимальная масса которых превышает 5 тонн, перечень которых утверждается органами исполнительной власти субъектов Российской Федерации — гг. Москвы, Санкт-Петербурга и Севастополя. На полосах для маршрутных транспортных средств разрешено движение велосипедистов в случае, если такая полоса располагается справа.`},
"18.3":{t:`В населенных пунктах водители должны уступать дорогу троллейбусам и автобусам, начинающим движение от обозначенного места остановки. Водители троллейбусов и автобусов могут начинать движение только после того, как убедятся, что им уступают дорогу.`},
"19.1":{t:`В темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на движущемся транспортном средстве должны быть включены следующие световые приборы: на всех механических транспортных средствах — фары дальнего или ближнего света, на велосипедах и средствах индивидуальной мобильности — фары или фонари, на гужевых повозках — фонари (при их наличии); на прицепах и буксируемых механических транспортных средствах — габаритные огни.`},
"19.2":{t:`Дальний свет должен быть переключен на ближний: в населенных пунктах, если дорога освещена; при встречном разъезде на расстоянии не менее чем за 150 м до транспортного средства, а также и при большем, если водитель встречного транспортного средства периодическим переключением света фар покажет необходимость этого; в любых других случаях для исключения возможности ослепления водителей как встречных, так и попутных транспортных средств. При ослеплении водитель должен включить аварийную сигнализацию и, не меняя полосу движения, снизить скорость и остановиться.`},
"19.3":{t:`При остановке и стоянке в темное время суток на неосвещенных участках дорог, а также в условиях недостаточной видимости на транспортном средстве должны быть включены габаритные огни. В условиях недостаточной видимости дополнительно к габаритным огням могут быть включены фары ближнего света, противотуманные фары и задние противотуманные фонари.`},
"19.4":{t:`Противотуманные фары могут использоваться: в условиях недостаточной видимости с ближним или дальним светом фар; в темное время суток на неосвещенных участках дорог совместно с ближним или дальним светом фар; вместо ближнего света фар в соответствии с пунктом 19.5 Правил.`},
"19.5":{t:`В светлое время суток на всех движущихся транспортных средствах (кроме велосипедов) с целью их обозначения должны включаться фары ближнего света или дневные ходовые огни.`},
"19.10":{t:`Звуковые сигналы могут применяться только: для предупреждения других водителей о намерении произвести обгон вне населенных пунктов; в случаях, когда это необходимо для предотвращения дорожно-транспортного происшествия.`},
"22.7":{t:`Водитель обязан осуществлять посадку и высадку пассажиров только после полной остановки транспортного средства, а начинать движение только с закрытыми дверями и не открывать их до полной остановки.`},
"24.11":{t:`В велосипедной зоне: велосипедисты и лица, использующие для передвижения средства индивидуальной мобильности, имеют преимущество перед механическими транспортными средствами, а также могут двигаться по всей ширине проезжей части, предназначенной для движения в данном направлении, при соблюдении требований пунктов 9.1(1) — 9.3 и 9.6 — 9.12 настоящих Правил; пешеходам разрешается переходить проезжую часть в любом месте при условии соблюдения требований пунктов 4.4 — 4.7 настоящих Правил.`}
};

{id:"1.6",title:"Проезд регулируемого перекрестка",

{id:"1.7",title:"Проезд нерегулируемого перекрестка равнозначных дорог",

{id:"1.8",title:"Проезд нерегулируемого перекрестка неравнозначных дорог",

{id:"1.9",title:"Левые и правые повороты",

{id:"1.10",title:"Проезд железнодорожного переезда",

{id:"1.11",title:"Перестроение на участке дороги с 2+ полосами в одном направлении",

{id:"1.12",title:"Обгон или опережение",
 desc:"Прежде чем начать обгон, убедитесь, что полоса движения свободна на достаточном расстоянии и вы не создадите опасности (п. 11.1). Включите левый указатель поворота, выезжайте на встречную полосу, обгоняйте ТС, возвращайтесь на свою полосу и выключите поворотник. Обгон запрещен: на регулируемых перекрестках и нерегулируемых при движении по второстепенной; на пешеходных переходах; на железнодорожных переездах и ближе 100 м перед ними; на мостах, путепроводах, эстакадах, в тоннелях; в конце подъема, на опасных поворотах и участках с ограниченной видимостью (п. 11.4). Нельзя начинать обгон, если впереди идущее ТС производит обгон или подало сигнал поворота налево, или если следующее за вами ТС начало обгон (п. 11.2). Запрещается выезжать для обгона на полосу встречного движения, если она отделена разметкой 1.1, 1.3 или 1.11 слева (п. 9.1(1), 9.2).",

{id:"1.13",title:"Движение с максимальной разрешенной скоростью",
 desc:"Водитель должен вести ТС со скоростью, не превышающей установленного ограничения, учитывая интенсивность движения, состояние ТС и дорожные условия (п. 10.1). В населенных пунктах — не более 60 км/ч, в жилых зонах и дворовых территориях — не более 20 км/ч (п. 10.2). Вне населенных пунктов: легковые автомобили — не более 90 км/ч на обычных дорогах, не более 110 км/ч на автомагистралях (п. 10.3). При буксировке — не более 50 км/ч (п. 10.4). Запрещается создавать помехи другим ТС, двигаясь без необходимости со слишком малой скоростью, а также резко тормозить, если это не требуется для предотвращения ДТП (п. 10.5). При возникновении опасности принять возможные меры к снижению скорости вплоть до остановки (п. 10.1).",

{id:"1.14",title:"Проезд пешеходных переходов и остановок маршрутных ТС",
 desc:"При приближении к нерегулируемому пешеходному переходу водитель обязан уступить дорогу пешеходам, переходящим дорогу или вступившим на проезжую часть (п. 14.1). Если перед нерегулируемым переходом остановилось или снизило скорость ТС, вы тоже обязаны остановиться или снизить скорость (п. 14.2). На регулируемом переходе при включении разрешающего сигнала дайте возможность пешеходам закончить переход (п. 14.3). Запрещается въезжать на переход, если за ним образовался затор (п. 14.4). Обязательно пропускайте слепых пешеходов с белой тростью (п. 14.5). Уступайте пешеходам, идущим к остановившемуся маршрутному ТС или от него (п. 14.6). При наличии табло «Внимание, пассажир!» остановитесь перед разметкой 1.17.2. Подъезжая к маршрутному ТС с детьми, снизьте скорость (п. 14.7).",

{id:"1.15",title:"Торможение и остановка при движении на различных скоростях",
 desc:"Кандидат выполняет торможение и остановку при движении на различных скоростях, включая экстренное торможение. Плавное торможение: заблаговременно включите указатель поворота, плавно нажмите на педаль тормоза, остановите ТС в намеченном месте. Экстренное торможение: при возникновении опасности резко нажмите на педаль тормоза до упора (на автомобилях с ABS — не блокируя руль), при необходимости одновременно нажмите на сцепление. Во время экстренного торможения не выключайте двигатель. Следите за обстановкой впереди и позади автомобиля. После остановки зафиксируйте ТС стояночным тормозом. Учитывайте дорожные условия: на мокрой или скользкой дороге тормозной путь увеличивается. Не тормозите резко без необходимости — это может вызвать ДТП.",

{id:"1.18",title:"Разворот на перекрестке и вне перекрестка",
 desc:"Разворот на перекрестке: выполняется из крайнего левого положения по箭头信号у светофора или по разметке. При развороте по зеленому сигналу уступите встречным ТС, движущимся прямо или направо (п. 13.4). Разворот вне перекрестка: перед маневром заблаговременно включите левый указатель поворота и займите крайнее левое положение. Уступите дорогу встречным ТС и трамваю попутного направления (п. 8.8). Если ширина проезжей части недостаточна, разворот допускается от правого края проезжей части или с правой обочины, уступив попутным и встречным ТС (п. 8.8). Разворот запрещается: на пешеходных переходах, в тоннелях, на мостах, путепроводах, эстакадах и под ними, на железнодорожных переездах, в местах с видимостью менее 100 м хотя бы в одном направлении, в местах остановок маршрутных ТС (п. 8.11).",
 pdd:["8.8","8.11","8.5","8.6","13.11","13.12","13.11(1)"],errors:["2.10","2.2","4.2"]}
];

/* ===== РЕНДЕР ЗАДАНИЙ ===== */
function renderTasks(){
  const wrap = document.getElementById('tasks-list');
  wrap.innerHTML = TASKS.map((t,i)=>`
    <div class="err-item" data-id="${t.id}">
      <div class="err-head" onclick="toggleItem(this)">
        <span class="num">${t.id}</span>
        <span class="title">${t.title}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="err-body"><div class="err-body-inner"><div class="err-content">
        <div class="label">Описание манёвра</div>
        <div class="err-desc">${t.desc}</div>
        <div class="label">Пункты ПДД — нажмите для полного текста</div>
        <div class="chips">${t.pdd.map(p=>`<button class="chip pdd" onclick="openPdd('${p}')">п. ${p}</button>`).join('')}</div>
        <div class="label">Возможные ошибки — нажмите для описания</div>
        <div class="chips">${t.errors.map(e=>`<button class="chip err" onclick="openError('${e}')">${e}</button>`).join('')}</div>
      </div></div></div>
    </div>
  `).join('');
}

/* ===== РЕНДЕР ОШИБОК ===== */
function renderErrors(){
  const wrap = document.getElementById('errors-list');
  const filtered = ERRORS;
  if(!filtered.length){ wrap.innerHTML = '<div class="empty-msg">Нет ошибок в выбранном разделе</div>'; return; }

  let html = '';
  let lastSec = '';
  filtered.forEach(e=>{
    if(e.sec!==lastSec){
      lastSec = e.sec;
      const labels = {s2:['7 баллов','Несдача','s2'],
        s3:['4 балла','','s3'],
        s4:['3 балла','','s4'],
        s5:['2 балла','','s5'],
        s6:['1 балл','','s6']};
      const l = labels[e.sec];
      html += `<div class="sect-banner ${l[2]}"><b>${l[0]}</b>${l[1]?l[1]:''}</div>`;
    }
    html += `
    <div class="err-item" data-id="${e.id}">
      <div class="err-head" onclick="toggleItem(this)">
        <span class="pts-badge sm ${e.sec==='s2'?'p7':e.sec==='s3'?'p4':e.sec==='s4'?'p3':e.sec==='s5'?'p2':'p1'}">${e.sec==='s2'?'7':e.pts}</span>
        <span class="title">${e.id}. ${e.title}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="err-body"><div class="err-body-inner"><div class="err-content">
        <div class="label">Описание ошибки</div>
        <div class="err-desc">${e.desc}</div>
        ${e.pdd&&e.pdd.length?`<div class="label">Пункты ПДД — нажмите для полного текста</div><div class="chips">${e.pdd.map(p=>`<button class="chip pdd" onclick="openPdd('${p}')">п. ${p}</button>`).join('')}</div>`:''}
        <div class="label">Типичные ситуации</div>
        <ul class="sit-list">${e.situations.map(s=>`<li>${s}</li>`).join('')}</ul>
      </div></div></div>
    </div>`;
  });
  wrap.innerHTML = html;
}

function toggleItem(head){
  head.closest('.err-item').classList.toggle('open');
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */
function openPdd(id){
  const p = PDD[id];
  const back = document.getElementById('modal-back');
  document.getElementById('modal-title').textContent = p ? 'Пункт '+id : 'Пункт '+id;
  document.getElementById('modal-body').innerHTML = p
    ? `<div class="text">${p.t}</div>`
    : `<div class="text">Текст пункта ${id} смотрите в актуальной редакции ПДД РФ (постановление Правительства РФ от 23.10.1993 № 1090, действуют до 01.03.2029).</div>`;
  back.classList.add('show');
}

function openError(id){
  const e = ERRORS.find(x=>x.id===id);
  if(!e) return;
  const back = document.getElementById('modal-back');
  document.getElementById('modal-title').textContent = e.id+'. '+e.title;
  document.getElementById('modal-body').innerHTML = `
    <div class="label">Описание ошибки</div>
    <div class="err-desc">${e.desc}</div>
    ${e.pdd&&e.pdd.length?`<div class="label">Пункты ПДД — нажмите для полного текста</div><div class="chips">${e.pdd.map(p=>`<button class="chip pdd" onclick="openPdd('${p}')">п. ${p}</button>`).join('')}</div>`:''}
    <div class="label">Типичные ситуации</div>
    <ul class="sit-list">${e.situations.map(s=>`<li>${s}</li>`).join('')}</ul>
  `;
  back.classList.add('show');
}

document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('modal-back').classList.remove('show');
});
document.getElementById('modal-back').addEventListener('click',e=>{
  if(e.target===e.currentTarget) e.currentTarget.classList.remove('show');
});

/* ===== ВКЛАДКИ ===== */
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    window.scrollTo({top:0});
  });
});

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
renderTasks();
renderErrors();
</script>
</body>
</html>
