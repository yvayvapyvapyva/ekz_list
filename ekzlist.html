<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171b21">
<title>Экзамен ГИБДД · категория «B» — Приказ МВД № 80 (ред. 26.05.2025)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#171b21;--paper:#f2f1ea;--card:#fff;--line:#e3e0d5;
  --ink:#1c2128;--mut:#5f6672;
  --red:#d7362a;--red-d:#b3241a;--orange:#e8702a;--amber:#f2a007;--yellow:#f5c518;
  --green:#23a55a;--blue:#1160b3;--blue-bg:#e9f1fb;--blue-line:#cfe0f2;
  --disp:'Russo One',sans-serif;--body:'Golos Text',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;
  padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:var(--yellow);color:var(--asphalt)}

main{max-width:900px;margin:0 auto;padding:16px 14px 24px}
.tab{display:none}
.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--asphalt);display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.35)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:#8b929e;font-size:10px;font-weight:600;border-radius:10px;position:relative;transition:color .2s}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--yellow)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--yellow);border-radius:0 0 3px 3px}

.h2{font-family:var(--disp);font-size:clamp(18px,4.5vw,24px);margin:8px 0 6px;color:var(--ink)}

.pts-badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  background:#fff;border:4px solid;font-family:var(--disp);font-size:18px;flex-shrink:0}
.pts-badge.p7{border-color:var(--red);color:var(--red)}
.pts-badge.p4{border-color:var(--orange);color:var(--orange)}
.pts-badge.p3{border-color:var(--amber);color:var(--amber)}
.pts-badge.p2{border-color:var(--yellow);color:#9a7000}
.pts-badge.p1{border-color:var(--green);color:var(--green)}
.pts-badge.sm{width:30px;height:30px;border-width:3px;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;transition:transform .15s;border:1px solid}
.chip:active{transform:scale(.95)}
.chip.pdd{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.chip.pdd::before{content:"§";font-weight:700}
.chip.err{background:#fff;border-color:var(--line);color:var(--ink)}

.err-item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.err-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.err-head .num{font-family:var(--disp);font-size:13px;color:var(--mut);min-width:44px}
.err-head .title{flex:1;font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.err-head .chev{width:20px;height:20px;color:var(--mut);transition:transform .25s;flex-shrink:0}
.err-item.open .chev{transform:rotate(180deg)}
.err-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.err-item.open .err-body{grid-template-rows:1fr}
.err-body-inner{overflow:hidden;min-height:0}
.err-content{padding:0 16px 16px;border-top:1px dashed var(--line);margin:0 0}
.err-content .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.err-content .label:first-child{margin-top:14px}
.sit-list{list-style:none}
.sit-list li{position:relative;padding:8px 10px 8px 30px;background:#fff7ed;border-left:3px solid var(--orange);border-radius:0 8px 8px 0;font-size:13.5px;color:#5c3a1e;margin-bottom:6px}
.sit-list li::before{content:"⚠";position:absolute;left:9px;top:8px;font-size:13px}
.cmd-block{white-space:pre-line;background:var(--blue-bg);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13.5px;color:#173a63;line-height:1.6}
.attention-block{white-space:pre-line;background:#fff7ed;border-left:3px solid var(--orange);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13.5px;color:#5c3a1e;line-height:1.6}
.examples-block{white-space:pre-line;background:#f6f5ef;border-left:3px solid var(--mut);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13.5px;color:#3d4450;line-height:1.6}
.err-desc{font-size:13.5px;color:#3d4450;background:#f6f5ef;padding:10px 12px;border-radius:8px;white-space:pre-line;line-height:1.6}

.sect-banner{border-radius:12px;padding:12px 14px;margin:18px 0 12px;color:#fff;font-size:13px;font-weight:600}
.sect-banner.s2{background:var(--red-d)}
.sect-banner.s3{background:var(--orange)}
.sect-banner.s4{background:var(--amber);color:#3d2800}
.sect-banner.s5{background:var(--yellow);color:#3d2800}
.sect-banner.s6{background:var(--green)}
.sect-banner b{font-family:var(--disp);font-size:14px;display:block;margin-bottom:2px}

/* Модальное окно */
.modal-back{position:fixed;inset:0;background:rgba(20,23,28,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-back.show{display:flex}
.modal{background:#fff;width:100%;max-width:640px;max-height:82vh;border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;animation:sheetUp .3s ease}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 14px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-head .title{font-family:var(--disp);font-size:17px;color:var(--ink);line-height:1.3}
.modal-close{width:36px;height:36px;border-radius:50%;background:#f6f5ef;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.modal-body{font-size:14.5px;color:#3d4450;line-height:1.55}
.modal-body .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.modal-body .lbl:first-child{margin-top:0}
@media(min-width:640px){
  .modal-back{align-items:center;padding:20px}
  .modal{border-radius:18px}
}

.empty-msg{text-align:center;color:var(--mut);padding:30px 16px;font-size:14px}
</style>
</head>
<body>

<main>
  <!-- ВКЛАДКА: ЗАДАНИЯ -->
  <section class="tab active" id="tab-tasks">
    <h2 class="h2">Задания экзамена</h2>
    <div id="tasks-list"></div>
  </section>

  <!-- ВКЛАДКА: ОШИБКИ -->
  <section class="tab" id="tab-errors">
    <h2 class="h2">Ошибки и нарушения</h2>
    <div id="errors-list"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="tab-tasks" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h10M9 12h10M9 19h10"/><path d="M4 6l1.5 1.5L8 5M4 13l1.5 1.5L8 13M4 20l1.5 1.5L8 20" stroke-linejoin="round"/></svg>
    Задания
  </button>
  <button data-tab="tab-errors">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L2 20h20L12 3z" stroke-linejoin="round"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
    Ошибки
  </button>
</nav>

<div class="modal-back" id="modal-back">
  <div class="modal">
    <div class="grab"></div>
    <div class="modal-head">
      <div class="title" id="modal-title"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="tasks.js"></script>
<script src="pdd.js"></script>
<script src="errors.js"></script>
<script>


/* ===== РЕНДЕР ЗАДАНИЙ ===== */
function renderTasks(){
  const wrap = document.getElementById('tasks-list');
  wrap.innerHTML = TASKS.map(t=>`
    <div class="err-item" data-id="${t.id}">
      <div class="err-head" onclick="toggleItem(this)">
        <span class="num">${t.id}</span>
        <span class="title">${t.title}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="err-body"><div class="err-body-inner"><div class="err-content">
        <div class="label">Варианты команды экзаменатора</div>
        <div class="cmd-block">${t.commands}</div>
        <div class="label">Описание манёвра</div>
        <div class="err-desc">${t.desc}</div>
        <div class="label">На что обратить особое внимание</div>
        <div class="attention-block">${t.attention}</div>
      </div></div></div>
    </div>
  `).join('');
}

/* ===== РЕНДЕР ОШИБОК ===== */
function renderErrors(){
  const wrap = document.getElementById('errors-list');
  const filtered = ERRORS;
  if(!filtered.length){ wrap.innerHTML = '<div class="empty-msg">Нет ошибок в выбранном разделе</div>'; return; }

  let html = '';
  let lastSec = '';
  filtered.forEach(e=>{
    if(e.sec!==lastSec){
      lastSec = e.sec;
      const labels = {s2:['7 баллов','Несдача','s2'],
        s3:['4 балла','','s3'],
        s4:['3 балла','','s4'],
        s5:['2 балла','','s5'],
        s6:['1 балл','','s6']};
      const l = labels[e.sec];
      html += `<div class="sect-banner ${l[2]}"><b>${l[0]}</b>${l[1]?l[1]:''}</div>`;
    }
    html += `
    <div class="err-item" data-id="${e.id}">
      <div class="err-head" onclick="toggleItem(this)">
        <span class="pts-badge sm ${e.sec==='s2'?'p7':e.sec==='s3'?'p4':e.sec==='s4'?'p3':e.sec==='s5'?'p2':'p1'}">${e.sec==='s2'?'7':e.pts}</span>
        <span class="title">${e.id}. ${e.title}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="err-body"><div class="err-body-inner"><div class="err-content">
        ${e.pdd&&e.pdd.length?`<div class="label">Пункты ПДД — нажмите для полного текста</div><div class="chips">${e.pdd.map(p=>`<button class="chip pdd" onclick="openPdd('${p}')">п. ${p}</button>`).join('')}</div>`:''}
        <div class="label">Примеры</div>
        <div class="examples-block">${e.examples}</div>
      </div></div></div>
    </div>`;
  });
  wrap.innerHTML = html;
}

function toggleItem(head){
  head.closest('.err-item').classList.toggle('open');
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */
function openPdd(id){
  const p = PDD[id];
  const back = document.getElementById('modal-back');
  document.getElementById('modal-title').textContent = p ? 'Пункт '+id : 'Пункт '+id;
  document.getElementById('modal-body').innerHTML = p
    ? `<div class="text">${p.t}</div>`
    : `<div class="text">Текст пункта ${id} смотрите в актуальной редакции ПДД РФ (постановление Правительства РФ от 23.10.1993 № 1090, действуют до 01.03.2029).</div>`;
  back.classList.add('show');
}

function openError(id){
  const e = ERRORS.find(x=>x.id===id);
  if(!e) return;
  const back = document.getElementById('modal-back');
  document.getElementById('modal-title').textContent = e.id+'. '+e.title;
  document.getElementById('modal-body').innerHTML = `
    ${e.pdd&&e.pdd.length?`<div class="label">Пункты ПДД — нажмите для полного текста</div><div class="chips">${e.pdd.map(p=>`<button class="chip pdd" onclick="openPdd('${p}')">п. ${p}</button>`).join('')}</div>`:''}
    <div class="label">Примеры</div>
    <div class="examples-block">${e.examples}</div>
  `;
  back.classList.add('show');
}

document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('modal-back').classList.remove('show');
});
document.getElementById('modal-back').addEventListener('click',e=>{
  if(e.target===e.currentTarget) e.currentTarget.classList.remove('show');
});

/* ===== ВКЛАДКИ ===== */
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
    window.scrollTo({top:0});
  });
});

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
renderTasks();
renderErrors();
</script>
</body>
</html>
